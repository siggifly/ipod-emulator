# Build and test the iPod 5G emulator on Linux, macOS and Windows.
#
# This file is the difference between "cross-platform" and "cross-platform until somebody tries".
# The core was portable in principle before it existed — `arm7tdmi` has no dependencies, `eapp-loader`
# uses only `std` — and it still had a hard Linux build break sitting in it (eframe with
# `default-features = false` and neither `x11` nor `wayland`, which winit answers with a
# `compile_error!`). Nothing but a Linux runner was ever going to find that.
#
# **Nothing in this file has ever run.** `gh api repos/siggifly/ipod-emulator/actions/runs` answered
# `total_count: 0` on 2026-08-23 — both workflows are `active` and neither has executed once, because
# nothing has been pushed since they were written: `origin/master` is 235 commits behind the branch
# this is being edited on, and that branch has no remote at all. That is the whole explanation for
# how a step could go on invoking `--check-update` against a binary that ignored it, and a recipe
# name that had been retired, for weeks without anybody seeing red.
#
# So every step below was run BY HAND on macOS on 2026-08-23, with its output recorded in the commit
# that changed it. That is not the same as a green run, and it is not claimed to be. **The first
# push is the first execution**, and Linux and Windows are where the surprises will be.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A failure that only reproduces in release is a failure this project has had: the interpreter's
  # hot paths are written for `opt-level = 3` and the test suites are all measured there.
  CARGO_INCREMENTAL: 0
  # Same remap as the release build, so CI compiles what a release compiles.
  RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=. --remap-path-prefix=/home/runner=~ --remap-path-prefix=/Users/runner=~

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # **Skip when this file is read by Forgejo.** Forgejo Actions also discovers
    # `.github/workflows/`, and these steps assume GitHub's containerised runners:
    # `apt-get` for the GL headers needs root, which a host executor is not, and
    # `actions/cache@v4` is not mirrored on data.forgejo.org. Run there it fails for
    # reasons that say nothing about the code, and a permanent red teaches people to
    # ignore reds. The Forgejo-native gates live in `.forgejo/workflows/ci.yml`.
    if: github.server_url == 'https://github.com'
    strategy:
      # Every platform reports, always. A Windows failure must not hide a Linux one.
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: macos-arm64
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest

    # **One test opens a real window** — `tools/ipod-gui/tests/startup_fit.rs`, which measures what
    # the platform does with it, because the headless backend applies no minimum clamp and reads the
    # same whether or not the defect is present. The Linux runner has no window server, and this
    # says so **in advance**, on that leg and no other. The test refuses to infer it: a backend left
    # unset answers "Could not initialize backend." and is indistinguishable from a headless runner
    # from the outside, so an inferred skip passed green through a real regression once already.
    #
    # **It licenses a skip; it does not prevent a window.** Measured on macOS 2026-08-23: with
    # `IPOD_GUI_NO_DISPLAY=1` set, `--test startup_fit` opened the window anyway and drove the
    # external resize — `the external-resize half ran: 846.0 -> 780.0 logical, driven from outside`.
    # The variable is read in exactly one place (`startup_fit.rs`'s `declared_headless`) and is
    # consulted only on the branch where the child has ALREADY failed to put a window on a display.
    # On a machine that has one it changes nothing, so anybody reaching for it to keep a window off
    # a screen is reaching for the wrong lever.
    #
    # This is therefore also the line that says **the Linux leg does not measure that test.** Making
    # it real means `xvfb-run` plus the runtime GL/X11 libraries — not the `-dev` packages below,
    # which are link-time only — and then deleting this declaration. Deliberately not done here: it
    # cannot be verified from the machine this was written on, and an unverifiable CI step is the
    # instrument shape this repository has been burned by most.
    #
    # **macOS and Windows are deliberately NOT declared, and the Windows half is unverified.** Both
    # runners are believed to have a desktop session; only macOS has been reasoned about with any
    # confidence. If the Windows leg goes red with "the window refused to open", that is the answer
    # to a question nobody could answer from here — add `matrix.os == 'windows-latest'` to the
    # condition below, with the log line as the evidence. A leg that cannot open a window must say
    # so; it must not be guessed at in either direction.
    env:
      IPOD_GUI_NO_DISPLAY: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}

    steps:
      - uses: actions/checkout@v4

      # Slint's winit backend on Linux links against the X11 and OpenGL headers. Wayland and
      # xkbcommon are opened at runtime by `dlopen`, but the dev packages are installed anyway so a
      # future change to either backend does not turn into a mystery.
      #
      # `eframe`, which this comment used to name, has not been in the graph since 0.5 — `grep -c
      # '^name = "eframe"' Cargo.lock` is 0. The package list is unchanged because winit needs the
      # same headers eframe did.
      - name: Linux display and GL headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev pkg-config

      - name: Rust version
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      # One workspace, one lockfile, one shared `target/` — so this is the only path worth caching,
      # and the key follows the root lockfile.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ matrix.name }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.name }}-cargo-

      # The interpreter, the machine and the loader, the .ipg / eApp / .sinf reader, and the
      # window's own unit tests — the arithmetic of the wheel, the PNG chunk CRCs, the settings
      # file, the image validator.
      # `startup_fit` opens a real window here — see the job's `env:` block for which leg measures
      # it and which one declares it cannot.
      #
      # **The count is read, and that is the gate.** `RELEASING.md` has said *a green line with a
      # zero in it is not a pass* in prose since 0.4.0 and nothing mechanical read it. An exit code
      # cannot tell a suite that ran from one that did not: a filter matching nothing, a
      # `#[cfg(test)]` module that stopped being compiled, and a test target dropped out of a
      # manifest all print `test result: ok.` and exit 0. Every such line is summed here.
      #
      # **A floor, not the number.** 799 passing on 2026-08-23 (macOS, the one doc-test included);
      # the floor is 700. An equality would have to be hand-edited by every commit that adds a test,
      # which is precisely how a count stops being a measurement and becomes a number people edit
      # from memory — `RELEASING.md` carries that lesson because its own count did it twice in a
      # day. The floor only has to catch the suite COLLAPSING, and it was proved to: summed over an
      # empty log it is 0, and over the single `test result: ok. 0 passed` line the checklist warns
      # about it is 0. Both controls run by hand, same date.
      #
      # `grep`/`tr`/`sed` and shell arithmetic rather than `awk`, because this runs on Git for
      # Windows' bash too and the three above are not in question there.
      - name: test the workspace, and read the count
        shell: bash
        run: |
          set -eo pipefail
          cargo test --release --workspace 2>&1 | tee tests.log
          sum=$(grep -oE '^test result: ok\. [0-9]+ passed' tests.log \
                | grep -oE '[0-9]+' | tr '\n' '+' | sed 's/+$//')
          passed=$(( ${sum:-0} ))
          echo "passing tests: $passed"
          if [ "$passed" -lt 700 ]; then
            echo "the suite reported $passed passing tests. The floor is 700 and it was 799 on"
            echo "2026-08-23. A zero-ish count under a green exit code is the failure this reads"
            echo "for; re-measure and move the floor deliberately rather than deleting the check."
            exit 1
          fi

      # **Again, with its output visible.** `cargo test` captures the stderr of a PASSING test, so
      # everything that test says about what it could and could not measure — the SKIPPED line, the
      # line naming the resize it drove from outside — is invisible in the step above. Measured, not
      # assumed: an `eprintln!` in a passing test does not appear without `--nocapture`, which is
      # how a "read the SKIPPED line in the CI log" instruction came to point at a line that could
      # never be printed. Two seconds, and the log says which half ran.
      - name: the window's platform test, with its output visible
        if: runner.os != 'Linux'
        run: cargo test --release -p ipod-gui --test startup_fit -- --nocapture

      # **The same file on Linux, under a name that does not claim it measured anything.** It ran
      # here before under the name above, which is a step title that reads as coverage on the one
      # leg that has none: the window cannot open, `declared_headless` licenses the skip, both tests
      # return early and the leg is green having observed nothing. Splitting it is the cheapest
      # honest fix available from a machine that cannot verify an `xvfb-run` step.
      #
      # It still RUNS, and that is worth the two seconds: the test binary has to compile and link
      # against the winit backend on Linux, which is where this project's one hard cross-platform
      # break lived. What it does not do is measure the fit.
      #
      # Making it real means `xvfb-run` plus the RUNTIME GL/X11 libraries — not the `-dev` packages
      # installed above, which are link-time only — the `IPOD_GUI_NO_DISPLAY` declaration deleted,
      # **and the leg verified to go red under a deliberate break.** That last clause is the whole
      # condition: `startup_fit.rs`'s own header states it, and this repository has shipped enough
      # gates that passed while doing nothing to insist on it.
      - name: startup_fit stands down on this leg and measures nothing
        if: runner.os == 'Linux'
        run: cargo test --release -p ipod-gui --test startup_fit -- --nocapture

      # The binaries have to LINK, not merely compile as libraries, and their argument parsing has
      # to survive contact with a shell that is not bash.
      - name: build every binary
        run: cargo build --release --workspace --bins

      # `--print` composes the recipe's argv without touching a disk, so it runs on a machine with
      # no `resources/` — which every CI runner is, and which is the whole point of checking it.
      # Verified rather than assumed: all seven compose and exit 0 with `HOME` pointed at an empty
      # directory, falling back to the repository defaults and saying so.
      #
      # **`cold` was in this list and is not a recipe.** `Recipe::parse` has no arm for it — the
      # word gets `unknown recipe \`cold\`` and **exit 2**, measured — so under `shell: bash`, which
      # is `-e`, this step could only ever have failed. It survived because the file has never run.
      # `RELEASING.md` retired the recipe on 2026-08-18 and says in the same breath that it must not
      # come back: it was the prototype's NOR, it boots a partition the retail ROM correctly
      # rejects, and it cost somebody hours.
      #
      # **`loader` was missing and is a recipe** — ipodloader2 out of the drive's own firmware
      # partition, the iPodLinux path, aliased `ipodlinux`. A list that names a recipe which does
      # not exist while omitting one that does is wrong in both directions at once, which is what a
      # hand-maintained list beside a `match` does eventually.
      #
      # **`--clock=5` is gone.** CHANGELOG 0.5.0 retires it with the honest-clock change — the
      # invented idle time was deleted and the flag turned out to cost nothing. It could never have
      # failed this step either way: `ipod-boot` passes everything it does not recognise through to
      # `trace` unchanged, so a flag's presence here tests the pass-through and not the flag.
      - name: the recipes compose the same argv they do on macOS
        shell: bash
        run: |
          BIN=target/release/ipod-boot
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="$BIN.exe"; fi
          "$BIN" --help
          for r in retail warm flsh rockbox loader flash-update from-idle; do
            echo "--- $r"
            "$BIN" "$r" --print
          done

      # **The flags that answer with no window at all.** Every one of these is decided before a
      # platform is set, so a runner that cannot open a window cannot stop it answering — which is
      # what makes them safe here, and it is new. Until 24dd262 `fn main` read argv nowhere:
      # `--check-update` was accepted and silently ignored, and `--help` OPENED A WINDOW on the
      # runner, which is a job that hangs or a backend that fails. Neither reads as *the flag is
      # gone*, which is why this step went on reporting for weeks about a program that did not
      # exist. Both spellings are back and both were run by hand on macOS 2026-08-23.
      #
      # On Windows a release build has no console of its own (`main.rs`'s `windows_subsystem`
      # attribute, with the cost stated there), so these print into nothing IN A TERMINAL.
      # Everything below is piped or redirected, which is the case that file records as working.
      # Empty output from a step that passed on the Windows leg is that attribute, not the flag.
      - name: the flags that answer without a window
        shell: bash
        run: |
          set -eo pipefail
          BIN=target/release/ipod-emulator
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="$BIN.exe"; fi

          # The runner has a network, so this normally takes the answering path — normally, because
          # unauthenticated api.github.com is rate-limited per IP and runners share theirs. Either
          # answer exits 0; that is the flag's whole contract and why it cannot fail a build.
          "$BIN" --check-update

          # ...and this takes the other one, deterministically, without cutting a network: a
          # repository that does not exist answers 404, which `update::check` turns into the same
          # `None` a dead host produces. Measured: "No answer from GitHub. That is the expected
          # result offline, and it is not an error", exit 0.
          IPOD_EMULATOR_UPDATE_REPO=siggifly/no-such-repository "$BIN" --check-update

          # `--help` must NAME the flag `release.yml` depends on. `--help > /dev/null`, which this
          # was, passes equally well when help prints nothing at all — and the entire reason the
          # help text is hand-written rather than generated from `FLAGS` is so that a flag lost from
          # one half is caught by the other. A gate that cannot tell empty from correct is not one.
          "$BIN" --help | grep -q -- '--make-app'

          # An unrecognised word must exit 2 rather than open a window. That is the failure that
          # would HANG this runner instead of failing it, so it is checked and not assumed.
          set +e
          "$BIN" --no-such-flag > /dev/null 2>&1
          code=$?
          set -e
          [ "$code" -eq 2 ] || { echo "an unrecognised flag exited $code; it must exit 2"; exit 1; }

      # A fresh clone has no images, and what it does about that is a supported path, not an edge
      # case: it must say which file is missing and where to read about it, and exit non-zero.
      - name: a missing image is reported rather than crashed on
        shell: bash
        run: |
          BIN=target/release/ipod-emulator
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="$BIN.exe"; fi
          out=$("$BIN" --check-images --flash=no-such.bin --disk=no-such.img || true)
          echo "$out"
          echo "$out" | grep -q "UNREADABLE" || { echo "expected an UNREADABLE verdict"; exit 1; }
