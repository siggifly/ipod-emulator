# Binaries for a tagged release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# NOT SIGNED, AND NOT NOTARIZED, deliberately. A locally built binary is not quarantined and runs
# with no ceremony; a downloaded one gets Gatekeeper's "unidentified developer" prompt on macOS and
# SmartScreen's on Windows, and the README says so plainly so that nobody files it as a bug. Buying
# a certificate to make a reverse-engineering tool look official is the wrong trade for this
# project, and the source is right there to build.
#
# **This workflow has never run, and its macOS legs could not have succeeded if it had.**
# `gh api repos/siggifly/ipod-emulator/actions/runs` answered `total_count: 0` on 2026-08-23, and
# every release from v0.1.0 to v0.4.0 was cut by hand — `RELEASING.md` describes doing exactly that.
# The `--make-app` line below had been `sh ipod-emulator …` since eaf0e82, which is `exit 127` under
# `set -eu` from a directory with no such file; it is measured and replaced in this commit.
#
# **It runs no tests.** The gate is `ci.yml` on the commit the tag points at, and `RELEASING.md`'s
# checklist for what a human runs against the built archives. Re-running the suite here would be
# worth its minutes if it could run everywhere it builds, and it cannot: the `macos-x86_64` leg
# cross-compiles, so its binaries do not execute natively on the runner that produced them.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Keep the machine that built a binary out of the binary. `rustc` embeds absolute source paths in
  # panic messages and debug info; without this a published binary names the runner's checkout and
  # its home directory. Set here rather than in a config file so `$HOME` and `$GITHUB_WORKSPACE`
  # expand — hardcoding a path would print in a public repository the thing it is meant to hide.
  RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=. --remap-path-prefix=/home/runner=~ --remap-path-prefix=/Users/runner=~

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled from the arm runner: Apple's SDK is universal, and nothing here has a
          # C dependency to find a cross toolchain for.
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # v0.1.0's Windows archive was cross-compiled from Linux with mingw rather than built
          # here, and it ran: `x86_64-pc-windows-gnu`, with `-L native=` pointing at winpthreads
          # because rustc links `-l:libpthread.a` and does not know where a distribution keeps it.
          # Kept as a note, not a job — a native msvc build is the better artifact when a runner
          # is available, and wine is what verified the cross-built one.

    steps:
      - uses: actions/checkout@v4

      - name: Linux display and GL headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev pkg-config

      - name: toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustc --version

      - name: build
        run: cargo build --release --target ${{ matrix.target }} --workspace --bins

      # `trace` and `ipod-boot` must end up in the SAME directory: `ipod-boot` defaults `TRACE` to
      # the binary beside itself, which is what makes a release archive work with no configuration.
      - name: stage the archive
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          EXE=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXE=".exe"; fi
          DIR="ipod5g-${{ matrix.name }}"
          mkdir -p "dist/$DIR"
          BIN="target/${{ matrix.target }}/release"
          # The emulator at the top, the six developer tools in `tools/`. Somebody who unpacked
          # this used exactly one of the seven and had to guess which; six of them are for reading
          # firmware apart, not for playing anything.
          #
          # `--bins` builds an eighth, `ipod-film`, and it is deliberately not here: it rebuilds
          # this repository's own animations and stills from a run, which is a thing you do to the
          # documentation, not to an iPod. Named so that the seven-out-of-eight is a decision
          # somebody made rather than one somebody forgot.
          mkdir -p "dist/$DIR/tools"
          cp "$BIN/ipod-emulator$EXE" "dist/$DIR/"
          for b in trace ipod-boot dis tcb eapp-inspect disasm ; do
            cp "$BIN/$b$EXE" "dist/$DIR/tools/"
          done
          # A double-clickable app on macOS. No certificate involved — see `--make-app` in
          # `ipod-emulator --help`, whose signature is `--make-app OUT [ICON]`: OUT is a DIRECTORY,
          # and what lands in it is `ipod-emulator.app`.
          #
          # **This line had never worked.** eaf0e82 rewrote `sh tools/ipod-gui/make-app.sh "$BIN/…"
          # "dist/$DIR"` into `sh ipod-emulator --make-app "$BIN/…" "dist/$DIR"` and left both the
          # `sh` and the old script's argument order behind — so it ran the emulator THROUGH a
          # shell, from a directory holding no such file: `sh: ipod-emulator: No such file or
          # directory`, exit 127, and under `set -eu` that is both macOS legs of this workflow
          # failing here. Then the flag itself died with the egui window, so for the last stretch it
          # was invoking a hole. Measured 2026-08-23, and the replacement was run by hand: it prints
          # the path it wrote, `plutil -lint` accepts the plist, and the binary inside is
          # sha256-identical to the one that made it.
          #
          # **It must be THIS archive's binary that runs it.** `--make-app` bundles whatever
          # executed it (`current_exe`), which is what makes a bundle built around a stale binary
          # impossible — and it means the runner's own `ipod-emulator` is the wrong one to use on
          # the `macos-x86_64` leg, where the archive's binary is cross-compiled and the runner is
          # arm64. Whether these images carry Rosetta 2 is not answerable from the machine this was
          # written on, so it is asked rather than assumed, and a leg that cannot answer says which
          # step to add instead of shipping an archive with no app in it.
          if [ "${{ runner.os }}" = "macOS" ]; then
            if ! "$BIN/ipod-emulator" --help > /dev/null 2>&1; then
              echo "the ${{ matrix.target }} binary does not run on this runner, so the .app cannot"
              echo "be built from it. Bundling with the runner's own binary would put the wrong"
              echo "architecture inside this archive, which is the failure --make-app bundling"
              echo "ITSELF exists to prevent. The fix is a rosetta install step on this leg:"
              echo "  softwareupdate --install-rosetta --agree-to-license"
              echo "It is not written here because it has never been run."
              exit 1
            fi
            "$BIN/ipod-emulator" --make-app "dist/$DIR" docs/media/icon-1024.png
          fi
          cp README.md "dist/$DIR/README.md"
          cp tools/ipod-gui/README.md "dist/$DIR/README-window.md"
          cp tools/ipod-boot/README.md "dist/$DIR/tools/README-recipes.md"
          # The README references these relatively; without them it renders with broken images.
          mkdir -p "dist/$DIR/docs"
          cp -r docs/media "dist/$DIR/docs/media"
          # A release archive that does not say what it cannot do is a support request in waiting.
          cat > "dist/$DIR/FIRST-RUN.txt" <<'EOF'
          This emulator needs two things it does not ship, because they are Apple's:

            1. A 1 MB (1 048 576 byte) dump of your iPod's NOR flash. Conventionally named
               `internal_rom_000000-0FFFFF.bin`, after the offset range it covers.
            2. Either an iPod software-update bundle (an .ipsw), from which `ipod-boot make-disk`
               builds a fresh drive image, or a drive image you already have.

          Run `ipod-emulator` with no arguments and it will ask for them, check what you picked, and
          tell you whether it will work before it tries to boot.

          `ipod-emulator --check-images --flash=... --disk=...` does the same check with no window.

          macOS: double-click `ipod-emulator.app`. The command-line tools are in `tools/`.

          NOTHING HERE IS SIGNED WITH A CERTIFICATE OR NOTARIZED, deliberately. macOS refuses the
          first launch of anything downloaded and unsigned. On macOS 15 and later the old
          right-click -> Open shortcut no longer works: open it, let it be blocked, then go to
          System Settings -> Privacy & Security, where a button offers to open it anyway. Once.
          `xattr -dr com.apple.quarantine ipod-emulator.app` does the same thing from a terminal.
          On Windows, SmartScreen shows "More info" -> "Run anyway". Built from source, neither
          happens, because nothing built locally is quarantined.
          EOF
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$DIR.zip" "$DIR" > /dev/null
          else
            tar czf "$DIR.tar.gz" "$DIR"
          fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ipod5g-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    # `workflow_dispatch` exists so the four builds can be exercised without minting a tag; there is
    # no release to attach them to in that case, and `gh release create` on a branch name would be
    # a confusing failure at the end of a run that otherwise worked.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # `gh` is preinstalled on the runner, so no third-party action is in the path between a tag
      # and a published binary.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          ls -la artifacts
          NOTES=$(cat <<'EOF'
          Binaries for macOS (arm64 and x86_64), Linux (x86_64) and Windows (x86_64).

          **Not signed with a certificate, and not notarized.** macOS refuses the first launch of
          anything downloaded and unsigned; on macOS 15 and later, open it, let it be blocked, then
          allow it once in System Settings -> Privacy & Security. Windows SmartScreen shows
          "More info" -> "Run anyway". Anything you build yourself is not quarantined.

          The emulator needs a NOR dump and either an .ipsw or a drive image, none of which ship
          here. `ipod-emulator` with no arguments asks for them and validates what you pick.
          EOF
          )
          gh release create "$TAG" artifacts/* \
            --title "iPod 5G emulator $TAG" \
            --notes "$NOTES" \
            --verify-tag
