name: ci

# Forgejo Actions — the gates that actually run.
#
# WHY THIS FILE EXISTS, and it is not "a second CI":
#
#   `.github/workflows/ci.yml` has NEVER EXECUTED. `gh api
#   repos/siggifly/ipod-emulator/actions/runs` answered `total_count: 0` on
#   2026-08-30 — after a 206-commit push to master, which should have fired
#   it — and a manual dispatch answers `HTTP 422: Actions has been disabled
#   for this user`. That is account-level and not something this repository
#   can fix; the repo API still cheerfully reports `enabled: true`.
#
#   So every gate this project believed it had was theatre. This file is the
#   same gates pointed at the forge that can run them.
#
# WHAT THIS DOES NOT COVER. The GitHub matrix builds Linux, macOS and
# Windows. This runner is Linux only, so a macOS- or Windows-specific break
# still gets through. That is a known hole, stated rather than papered over:
# when GitHub Actions is unblocked, keep BOTH and let this one be the fast
# gate. Do not delete `.github/workflows/ci.yml` for it.
#
# The toolchain is host-provided — data.forgejo.org carries no dtolnay
# mirror, the same constraint the umbrella's build-check.yml documents.

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          cargo --version
          rustc --version

      # **Four crates, not five, and the reason is not laziness.** `ipod-gui`
      # pulls `backend-winit` + `renderer-skia`, which need system GL and display
      # headers. The GitHub workflow installs them with `apt-get`; this runner is
      # a host executor with no root, so it cannot. Building the window here
      # fails for a reason that says nothing about the code.
      #
      # ⚠️ **This paragraph said `eframe` until 2026-09-08**, long after the
      # window became Slint — a gate explaining itself with a dependency the
      # crate no longer has. The *shape* of the blocker survived the rewrite and
      # the *reason given* did not, which is how a stale justification outlives
      # three agents noticing it in passing.
      #
      # **What it would take**, recorded so the next person does not re-derive
      # it: only `tests/startup_fit.rs` needs a real window. Everything else runs
      # on `i-slint-backend-testing`, which is headless — the whole page-shot
      # suite already does. So this is system packages on the runner, not a
      # property of the tests. Changing the runner's `hostPackages` restarts it
      # and kills in-flight CI, so it is a deliberate operation rather than a
      # commit.
      #
      # **And the hole has a second half nobody had written down.** Both
      # workflows run `--release`, and this crate has assertions gated
      # `#[cfg_attr(not(debug_assertions), ignore)]`. On 2026-09-08 two of them
      # were red on `dev` for a whole evening while every verification reported
      # zero failures, because every verification was a release run. A gate
      # switched off in the profile it runs in is not a gate.
      #
      # What is covered is where the emulator actually lives: the ARMv4T core,
      # the machine and its peripherals and boot path, the static inspector, and
      # `docgen` — pure std, no dependencies, so none of the display problem
      # applies. It is in the gate because its whole job is to fail when
      # `research/FINDINGS.md` and the corpus disagree, and a generator nobody
      # runs is exactly the drift it exists to prevent.
      # What is NOT covered is the window. That hole is real — state it, do not
      # let a green tick here be read as "the GUI builds".
      - name: Build the core crates
        run: cargo build -p arm7tdmi -p ipod-machine -p eapp-inspect -p docgen --all-targets

      # **The count AND the clock.** This repository has been burned by a
      # suite that reported "275 passed" in 0.26 s without compiling
      # anything. A pass that arrives impossibly fast is not a pass, so the
      # gate reads both numbers and refuses a suspicious one.
      - name: Test, and read the count and the clock
        run: |
          set -o pipefail
          start=$(date +%s)
          cargo test -p arm7tdmi -p ipod-machine -p eapp-inspect -p docgen 2>&1 | tee /tmp/test.log
          elapsed=$(( $(date +%s) - start ))
          passed=$(grep -oE 'test result: ok\. [0-9]+ passed' /tmp/test.log \
                   | awk '{s+=$4} END {print s+0}')
          echo "passed=$passed elapsed=${elapsed}s"
          # **420, from a measured baseline of 472** — re-measured 2026-09-01.
          # The old pair here read 250 against 294 and the 294 was from
          # 2026-08-30; the suite has since grown to 472, so the floor was 53% of
          # the real count and could not have bitten. A floor is only a gate while
          # somebody re-measures it, which is the same failure this repository
          # keeps meeting in its instruments. The floor sits below the count with
          # room for a genuinely removed test, and far enough above zero that a
          # suite which silently stops collecting cannot pass. A floor picked by
          # guesswork is a gate that never bites; this one has a number behind it.
          if [ "$passed" -lt 420 ]; then
            echo "::error::only $passed tests ran; the baseline is 472"
            exit 1
          fi
          if [ "$elapsed" -lt 5 ]; then
            echo "::error::suite finished in ${elapsed}s — it did not compile or did not run"
            exit 1
          fi

  no-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # AGENTS.md §2: nothing under `resources/` is ever committed, and no
      # real serial, GUID, name or Apple ID enters a tracked file. This gate
      # is cheap and the failure it prevents is not reversible — once a
      # identifier is pushed to a public repository it stays reachable.
      - name: Nothing from resources/, and no credentials
        run: |
          fail=0
          if git ls-files | grep -q '^resources/'; then
            echo "::error::files under resources/ are tracked; AGENTS.md §2 forbids it"
            fail=1
          fi
          if git grep -nIE 'BEGIN [A-Z ]*PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' \
               -- . ':(exclude).forgejo' >/dev/null 2>&1; then
            echo "::error::a credential-shaped string is tracked"
            fail=1
          fi
          exit $fail
