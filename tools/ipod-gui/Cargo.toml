[package]
name = "ipod-gui"
version.workspace = true
edition = "2021"
description = "An interactive iPod 5G: the emulator's framebuffer on a drawn device whose wheel, buttons and hold switch reach the machine"

# The binary is `ipod-emulator`, not `ipod-gui`. macOS shows the EXECUTABLE's name in the
# application switcher and the process list — not the crate's, and not `CFBundleName` — so a bare
# binary called `ipod-gui` appears in Cmd-Tab under that name. The crate keeps its own name because
# it is the window crate among four.
[[bin]]
name = "ipod-emulator"
path = "src/main.rs"

# A sibling crate rather than another `[[bin]]` in eapp-loader, deliberately. A UI toolkit pulls in
# winit and a hundred transitive crates; putting it behind a feature in eapp-loader would still make
# `cargo build` there resolve them, and every baseline in research/ is measured with `cargo test
# --release` in that crate. Keeping the window out of the emulator's manifest keeps that fast and
# keeps `trace` buildable on a machine with no display stack at all.
#
# **Slint, not egui, since 0.5** — see docs/GUI.md §20 for the argument. The two facts that decided
# it: a semver-stable 1.x with a release every few weeks, and `SharedPixelBuffer` +
# `image-rendering: pixelated`, which is a stable-API path to a pixel-exact framebuffer rather than
# a fight. The GPLv3 option matches this repository exactly, so it costs nothing.
#
# `unstable-wgpu-*` is deliberately NOT enabled. It is the one part of Slint outside the 1.x
# stability promise, and docs/GUI.md §16 argues we never need it: the screen is 76,800 pixels, so
# any presentation effect worth having costs nothing on the CPU.
#
# `backend-winit` + `renderer-skia` rather than the default set: skia because the material in
# docs/GUI.md §7 is gradients and rounded rectangles and skia draws those properly at any DPI —
# **and `accessibility`, because turning the default set off dropped it**; see below.

# ── Accessibility (docs/GUI.md §16.7, §20 item 11) ───────────────────────────────────────────────
#
# **On by default.** `accessibility` is in slint's own default feature set; the `default-features =
# false` below dropped it and nothing put it back, so `grep -c accesskit Cargo.lock` returned 0 and
# every ARIA claim in the previous design was false as built.
#
# The chain, read from the manifests rather than assumed: `slint/accessibility` →
# `i-slint-backend-selector/accessibility` → `i-slint-backend-winit?/accessibility` →
# `dep:accesskit, dep:accesskit_winit`. The weak `?` resolves because `backend-winit` is on, and
# feature unification turns it on for the direct `i-slint-backend-winit` dependency below too.
#
# It is a named feature rather than an unconditional one so that `accessibility_is_compiled_in` has
# a control that makes it go red: `cargo test -p ipod-gui --no-default-features`.
#
# Measured cost on aarch64-apple-darwin, `--release` with this workspace's `lto = "thin",
# codegen-units = 1`: +5 crates (accesskit, accesskit_consumer, accesskit_macos, accesskit_winit,
# uuid). **Linux is the one that is not cheap** — `accesskit_unix` pulls the AT-SPI stack and the
# graph grows by 16, not 5. Worth knowing before the first Linux CI job.
#
# One correction to the design's stated reason, because a comment describing a mechanism that is not
# there is the next drift: §16.8's single-letter shortcut suppression does **not** key on this
# feature. `accessible-role` is a compiler-level property with no `cfg` near it, and the suppression
# is a root `FocusScope` that a focused `TextInput` consumes character keys ahead of — which is
# focus, and works with the feature off. What the feature buys is the *announced* half: an
# `AccessibleRole` reaching an assistive technology at all.
[features]
default = ["accessibility"]
accessibility = ["slint/accessibility"]

[dependencies]
eapp-loader = { path = "../eapp-loader" }

# ── The file picker (docs/GUI.md §17 Q3, §11.4) ──────────────────────────────────────────────────
#
# The one crate in this graph that opens a window this program did not draw. Until it was added,
# `main::caps().file_picker` was a `false` literal and every `Provide…`, `Add a dump…` and
# `Choose a folder…` in the program was greyed out saying so — which was true, and which made the
# command line the only way to give this program a file. §17 Q3's own words: *"drag-and-drop is the
# better route and it is window-wide, but 'the only way to give this program a file is to drag it'
# is not a program."*
#
# **Measured, not assumed** — `cargo tree -p ipod-gui --target <t> --prefix none -e normal,build |
# sed 's/ (\*)//' | sort -u | wc -l`, before and after, on rfd 0.17.2:
#
#     aarch64-apple-darwin      352 → 353   +1  (rfd)
#     x86_64-pc-windows-msvc    347 → 348   +1  (rfd)
#     x86_64-unknown-linux-gnu  430 → 432   +2  (rfd, pollster)
#
# Everything else rfd asks for is already compiled here — `block2`, `dispatch2`, `objc2 0.6`,
# `objc2-app-kit 0.3`, `objc2-foundation`, `objc2-core-foundation`, `raw-window-handle 0.6` and
# `log` on macOS, `windows-sys` on Windows, and the three `wayland-*` crates on Linux through winit.
#
# **§17 Q3's premise about Linux is out of date, and the measurement is what shows it.** It says
# rfd *"pulls GTK or xdg-desktop-portal"* and recommends the portal; in rfd 0.17 the portal is the
# DEFAULT (`default = ["xdg-portal", "wayland"]`) and GTK3 is opt-in. The alternative was measured
# too: `features = ["gtk3"]` is **449 on Linux, +19**, dragging in atk-sys, cairo-sys-rs, gdk-sys,
# gdk-pixbuf-sys, gio-sys, glib-sys, gobject-sys, gtk-sys, pango-sys and the whole system-deps /
# toml build-script stack behind them. So both features are named here rather than inherited — the
# `wayland` one is what lets the portal parent its dialog to our window, and it measured free
# because winit already carries those three crates.
#
# **No `common-controls-v6`**, which is not in rfd's default set either. It is a `windows-sys`
# feature rather than a crate, so it costs nothing to compile; it is off because the Vista-era
# dialog is what upstream ships by default and there is no measurement here saying the other one is
# better.
#
# §16.4's Windows note is the one thing to re-read before touching this: winit's file drag-and-drop
# uses apartment-threaded COM, and a picker that used multi-threaded COM on the same thread would
# interfere with it. rfd's Windows backend initialises apartment-threaded COM per call, which
# agrees.
rfd = { version = "0.17", default-features = false, features = [
    "xdg-portal",
    "wayland",
] }
arm7tdmi = { path = "../arm7tdmi" }
slint = { version = "1.17", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-skia",
    "compat-1-2",
] }

# Only so the window can be asked for an OPAQUE one. Slint's winit backend creates a transparent
# window by default on macOS, which leaves the system title bar showing whatever is behind the app
# — the client area looks right because we paint it, and the title bar does not. There is no
# Slint-level property for this, so the window attributes have to be reached through the backend.
i-slint-backend-winit = { version = "1.17", default-features = false, features = [
    "renderer-skia",
] }

# ── The client-height reader (docs/GUI.md §9.6, §20 item 8) ──────────────────────────────────────
#
# Both of the crates below are ALREADY in the dependency tree at these versions and these features —
# `objc2-app-kit`'s `NSScreen` arrives through its own `default` set, which `i-slint-backend-winit`
# asks for. Declaring them adds no compilation; it only makes them importable, **which a transitive
# dependency is not**. §9.6's "already in the tree" invites exactly that mistake.
#
# Pin 0.3 / 0.6 deliberately: `objc2-app-kit 0.2.2` and `objc2 0.5.2` are also in this tree, via
# `copypasta` and `winit`, with a different `NSScreen` API. The pointer winit hands over is an
# opaque ObjC object either way, so reinterpreting it as the 0.3 type is sound; resolving the `use`
# against the 0.2 crate would not compile.
# ── Free space, for docs/GUI.md §12.4's park (`machine::free_bytes`) ─────────────────────────────
#
# **Already in the tree at this version**, exactly like `objc2` above: `cargo tree -p ipod-gui
# --prefix none | grep '^libc '` printed `libc v0.2.189` before this line existed, through winit.
# Declaring it adds no compilation; it only makes it importable, which a transitive dependency is
# not. `cargo tree -p ipod-gui --prefix none | sed 's/ (\*)//' | sort -u | wc -l` is the same before
# and after.
#
# There is no free-space API in `std`, and §12.4 requires the check to run BEFORE `save_on_quit` is
# set — a park that fails for lack of space fails at window close, where there is no window left to
# report it in. `statvfs` is the whole of what is used.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
#
# `NSWorkspace` joins `NSScreen` for docs/GUI.md §8.4: `accessibilityDisplayShouldReduceMotion` is
# the platform's own answer and Slint has none — a grep for `reduced.motion` across `i-slint-core`,
# `i-slint-common` and `builtins.slint` returns nothing. It is a feature of a crate that is already
# compiled, so it adds **no crates**: `cargo tree -p ipod-gui | wc -l` is the same before and after.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSScreen",
    "NSWorkspace",
] }

# 0.61, not 0.52: both are in the Windows tree (0.61 via muda and softbuffer, 0.52 via winit and
# glutin) and 0.52 would be a third copy. `Win32_Foundation` and `Win32_UI_WindowsAndMessaging` are
# both already enabled there.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.17"

# A headless backend. It began as one test's dependency — `a_missing_winit_window_is_none_not_a_
# panic`, whose `None` branch needs a `slint::Window`, which needs a platform — and it is now the
# platform every window test in `main.rs` runs on. `default-features = false` is not decoration:
# this crate's optional features (`mcp`, `system-testing`) pull prost, protox and an image stack,
# and none of them is wanted.
#
# ── `renderer-skia`, so a page can be drawn with no window (docs/GUI.md §20 item 22) ─────────────
#
# **This is what makes `shoot` possible**, and it is the whole of the mechanism. Read out of
# `i-slint-backend-testing-1.17.1` rather than guessed at:
#
#   * `TestingBackendOptions::renderer_name` (`testing_backend.rs:150`) — its own doc says *"windows
#     embed a real rasterizer so headless rendering (e.g. `Window::take_snapshot`) works"*. Left
#     `None`, which is what `init_no_event_loop()` does, the window's renderer is a MOCK with fixed
#     test-font metrics and `Window::take_snapshot` returns `Err("WindowAdapter::take_snapshot is
#     not implemented by the platform")` (`i-slint-core-1.17.1/renderer.rs:154`).
#   * `create_headless_renderer` (`testing_backend.rs:576`) resolves `"skia"` to
#     `SkiaRenderer::default_software`, which is Skia's CPU rasterizer.
#   * `SkiaRenderer::take_snapshot` (`i-slint-renderer-skia-1.17.1/lib.rs:1009`) wraps a
#     `SharedPixelBuffer` with `skia_safe::surfaces::wrap_pixels` and renders straight into it. It
#     never touches `self.surface`, so no surface, no winit window, and nothing opens.
#
# **The measured cost is zero crates.** `cargo tree -p ipod-gui --prefix none | sed 's/ (\*)//' |
# sort -u | wc -l` is 353 before and 353 after: `i-slint-renderer-skia` is already compiled for the
# `renderer-skia` on `slint` above, and the feature only makes the testing backend hand it out.
#
# `renderer-software` is the alternative and was measured too: 355, because
# `i-slint-renderer-software` and `integer-sqrt` are new. Two crates is not much, but it would also
# be a SECOND rasterizer — a screenshot drawn by code the program never ships. Skia's software
# surface runs the same itemrenderer the window runs, which is the point of taking the shot.
[dev-dependencies]
i-slint-backend-testing = { version = "1.17", default-features = false, features = [
    "renderer-skia",
] }
