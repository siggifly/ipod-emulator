[package]
name = "ipod-gui"
version.workspace = true
edition = "2021"
description = "An interactive iPod 5G: the emulator's framebuffer on a drawn device whose wheel, buttons and hold switch reach the machine"

# The binary is `ipod-emulator`, not `ipod-gui`. macOS shows the EXECUTABLE's name in the
# application switcher and the process list — not the crate's, and not `CFBundleName` — so a bare
# binary called `ipod-gui` appears in Cmd-Tab under that name. The crate keeps its own name because
# it is the window crate among four.
[[bin]]
name = "ipod-emulator"
path = "src/main.rs"

# A sibling crate rather than another `[[bin]]` in eapp-loader, deliberately. A UI toolkit pulls in
# winit and a hundred transitive crates; putting it behind a feature in eapp-loader would still make
# `cargo build` there resolve them, and every baseline in research/ is measured with `cargo test
# --release` in that crate. Keeping the window out of the emulator's manifest keeps that fast and
# keeps `trace` buildable on a machine with no display stack at all.
#
# **Slint, not egui, since 0.5** — see docs/GUI.md §20 for the argument. The two facts that decided
# it: a semver-stable 1.x with a release every few weeks, and `SharedPixelBuffer` +
# `image-rendering: pixelated`, which is a stable-API path to a pixel-exact framebuffer rather than
# a fight. The GPLv3 option matches this repository exactly, so it costs nothing.
#
# `unstable-wgpu-*` is deliberately NOT enabled. It is the one part of Slint outside the 1.x
# stability promise, and docs/GUI.md §16 argues we never need it: the screen is 76,800 pixels, so
# any presentation effect worth having costs nothing on the CPU.
#
# `backend-winit` + `renderer-skia` rather than the default set: skia because the material in
# docs/GUI.md §7 is gradients and rounded rectangles and skia draws those properly at any DPI.
[dependencies]
eapp-loader = { path = "../eapp-loader" }
arm7tdmi = { path = "../arm7tdmi" }
slint = { version = "1.17", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-skia",
    "compat-1-2",
] }

# Only so the window can be asked for an OPAQUE one. Slint's winit backend creates a transparent
# window by default on macOS, which leaves the system title bar showing whatever is behind the app
# — the client area looks right because we paint it, and the title bar does not. There is no
# Slint-level property for this, so the window attributes have to be reached through the backend.
i-slint-backend-winit = { version = "1.17", default-features = false, features = [
    "renderer-skia",
] }

[build-dependencies]
slint-build = "1.17"
